          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Una primera versión funcionando entre 4 y 8 semanas. Un producto completo entre 3 y 6 meses según el alcance. Mostramos avances en demos cada una o dos semanas para que veas resultados reales."

          "@type": "Question",
          "name": "¿Pueden integrarse con un sistema que ya tengo?",

            "@type": "Answer",
            "text": "Sí. Conectamos tu sistema actual con uno nuevo y migramos gradualmente, sin interrumpir la operación. Cambiamos lo que conviene y conservamos lo que funciona."

        },

          "@type": "Question",
          "name": "¿Ofrecen soporte y mantenimiento después del lanzamiento?",

          }
        },
        {
          "@type": "Question",
          "name": "¿Trabajan con empresas fuera de Argentina?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Facturamos en dólares al exterior y atendemos en español e inglés. Ya trabajamos con clientes de Latinoamérica y Europa."

        },

          "@type": "Question",
          "name": "¿Cuánto cuesta desarrollar una app o plataforma web en Argentina?",

        }
